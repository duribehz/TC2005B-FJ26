services:
  db:
    image: mariadb:12
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "admin"
      MYSQL_DATABASE: "default"
    ports:
      - 3306:3306
    volumes:
      - mariadb_data:/var/lib/mysql:Z
      - ./init:/docker-entrypoint-initdb.d:Z

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  mariadb_data: